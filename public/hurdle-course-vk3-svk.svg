<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1309 1201" role="img" aria-labelledby="title description">
  <title id="title">Hürdenlauf mit sechs Hürden</title>
  <desc id="description">Schwarz-weiße Streckengrafik für VDH-VK 3 und VDH-S-VK mit den Hürden 1 bis 6, Wendestange, Start und Ziel.</desc>

  <rect width="1309" height="1201" fill="#fff"/>

  <defs>
    <g id="hurdle-six" fill="none" stroke="#050505" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-88 0 H88" stroke-width="5"/>
      <path d="M-66 8 L-81 34 C-84 41 -78 46 -66 46 C-54 46 -48 41 -51 34 L-65 8" fill="#fff" stroke-width="4"/>
      <path d="M66 8 L51 34 C48 41 54 46 66 46 C78 46 84 41 81 34 L67 8" fill="#fff" stroke-width="4"/>
    </g>
  </defs>

  <!-- Laufweg durch die Hürden -->
  <path
    d="M176 1066
       L355 786
       L477 607
       L624 414
       L680 345
       L817 139
       C851 96 920 94 978 102
       C1039 110 1064 137 1044 170
       L921 345
       L785 535
       L606 785
       L422 1066"
    fill="none"
    stroke="#050505"
    stroke-width="8"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- äußerer Laufweg -->
  <path
    d="M932 156 H1281 L691 1066 H473"
    fill="none"
    stroke="#050505"
    stroke-width="7"
    stroke-linecap="square"
    stroke-linejoin="miter"
  />

  <!-- gestrichelte Hürdenlinien -->
  <g fill="none" stroke="#050505" stroke-width="3" stroke-linecap="round" stroke-dasharray="12 10">
    <path d="M280 812 H496"/>
    <path d="M444 562 H658"/>
    <path d="M590 372 H799"/>
  </g>

  <!-- Hürden 1 bis 6 -->
  <use href="#hurdle-six" transform="translate(337 785)"/>
  <use href="#hurdle-six" transform="translate(499 535)"/>
  <use href="#hurdle-six" transform="translate(645 345)"/>
  <use href="#hurdle-six" transform="translate(886 345)"/>
  <use href="#hurdle-six" transform="translate(746 535)"/>
  <use href="#hurdle-six" transform="translate(586 785)"/>

  <!-- Wendestange -->
  <path
    d="M928 20 C933 20 936 23 936 28 V150 C936 156 933 159 928 159 C923 159 920 156 920 150 V28 C920 23 923 20 928 20 Z"
    fill="#fff"
    stroke="#050505"
    stroke-width="4"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Starttor -->
  <path
    d="M112 936 C116 936 119 939 119 944 V1065 H236 V944 C236 939 239 936 243 936 C247 936 250 939 250 944 V1069 H105 V944 C105 939 108 936 112 936 Z"
    fill="#fff"
    stroke="#050505"
    stroke-width="4"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Zieltor -->
  <path
    d="M341 936 C345 936 348 939 348 944 V1065 H466 V944 C466 939 469 936 473 936 C477 936 480 939 480 944 V1069 H334 V944 C334 939 337 936 341 936 Z"
    fill="#fff"
    stroke="#050505"
    stroke-width="4"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Startbereich -->
  <path
    d="M105 1070 L29 1181 H171 L250 1070"
    fill="none"
    stroke="#050505"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
    stroke-dasharray="10 8"
  />

  <!-- Zielpfeil -->
  <path d="M422 1066 L429 1018 L451 1036 Z" fill="#050505"/>

  <g
    fill="#050505"
    stroke="#fff"
    stroke-width="8"
    stroke-linejoin="round"
    paint-order="stroke fill"
    font-family="Arial, Helvetica, sans-serif"
    font-weight="800"
  >
    <text x="337" y="851" text-anchor="middle" font-size="39">1</text>
    <text x="499" y="601" text-anchor="middle" font-size="39">2</text>
    <text x="645" y="411" text-anchor="middle" font-size="39">3</text>
    <text x="886" y="411" text-anchor="middle" font-size="39">4</text>
    <text x="746" y="601" text-anchor="middle" font-size="39">5</text>
    <text x="586" y="851" text-anchor="middle" font-size="39">6</text>
  </g>
  <g fill="#050505" font-family="Arial, Helvetica, sans-serif" font-weight="800">
    <text x="337" y="699" transform="rotate(-55 337 699)" font-size="36">Laufweg</text>
    <text x="176" y="1104" text-anchor="middle" font-size="39" font-style="italic">Start</text>
    <text x="407" y="1104" text-anchor="middle" font-size="39" font-style="italic">Ziel</text>
  </g>
</svg>
